name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the newest SDK patch that global.json's latestPatch policy admits.
          global-json-file: global.json
      - name: Configure test artifacts
        # Redirect transient process-test artifacts (staged closures, manifests, packed feeds) to a
        # known path so the failure-retention step below can surface them for debugging. The runner
        # context is unavailable to job-level env, so the path is exported here.
        run: echo "ORLEANS_SIMULATION_TEST_ARTIFACTS=$RUNNER_TEMP/orleans-simulation-artifacts" >> "$GITHUB_ENV"
      - name: Build
        run: dotnet build Clockwork.slnx --configuration Release
      - name: Test kernel
        run: dotnet run --project tests/Clockwork.Tests/Clockwork.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test Runtime
        run: dotnet run --project tests/Clockwork.Runtime.Tests/Clockwork.Runtime.Tests.csproj --configuration Release --no-build -- --timeout 120s
      - name: Repeat race exploration corpus
        run: |
          for iteration in 1 2 3; do
            dotnet run --project tests/Clockwork.Runtime.Tests/Clockwork.Runtime.Tests.csproj --configuration Release --no-build -- --timeout 120s --filter-namespace Orleans.Testing.Simulation.Runtime.Tests.Racing
          done
      - name: Test Instrumentation
        run: dotnet run --project tests/Clockwork.Instrumentation.Tests/Clockwork.Instrumentation.Tests.csproj --configuration Release --no-build -- --timeout 180s
      - name: Test Testing
        run: dotnet run --project tests/Clockwork.Testing.Tests/Clockwork.Testing.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test analyzers
        run: dotnet run --project tests/Clockwork.Analyzers.Tests/Clockwork.Analyzers.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test conformance (Debug lowering)
        run: dotnet run --project tests/Clockwork.Conformance.Tests/Clockwork.Conformance.Tests.csproj --configuration Debug -- --timeout 300s
      - name: Test channel conformance without tiered compilation
        # Fully optimized framework code inlines small forwarders, so the escape guard's channel exception (#59) must
        # not depend on their frames.
        env:
          DOTNET_TieredCompilation: '0'
          DOTNET_ReadyToRun: '0'
        run: dotnet run --project tests/Clockwork.Conformance.Tests/Clockwork.Conformance.Tests.csproj --configuration Debug --no-build -- --timeout 300s --filter-class Orleans.Testing.Simulation.Conformance.Tests.ChannelConformanceTests
      - name: Package smoke tests
        # Exercises all seven real packed NuGet artifacts end-to-end in an isolated feed,
        # verifies evaluated/restored/packed dependency boundaries and the source-build map,
        # consumes the build package through the real MSBuild targets, and installs + runs the tool.
        # Gated behind ORLEANS_SIMULATION_SMOKE_TESTS so ordinary runs
        # skip these slower flows. ORLEANS_SIMULATION_TEST_ARTIFACTS redirects transient fixtures/manifests to a
        # known path so they can be retained on failure.
        env:
          ORLEANS_SIMULATION_SMOKE_TESTS: "1"
        run: dotnet run --project tests/Clockwork.Instrumentation.Tests/Clockwork.Instrumentation.Tests.csproj --configuration Release --no-build -- --timeout 600s --filter-namespace Orleans.Testing.Simulation.Instrumentation.Tests.Packaging
      - name: Upload instrumentation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: orleans-simulation-instrumentation-artifacts
          path: |
            ${{ runner.temp }}/orleans-simulation-artifacts/**/*.manifest.json
            ${{ runner.temp }}/orleans-simulation-artifacts/**/staged/**
            ${{ runner.temp }}/orleans-simulation-artifacts/**/orleans-simulation/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack
        run: |
          dotnet pack src/Orleans.Testing.Simulation/Orleans.Testing.Simulation.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Instrumentation/Orleans.Testing.Simulation.Instrumentation.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Instrumentation.Build/Orleans.Testing.Simulation.Instrumentation.Build.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Analyzers/Orleans.Testing.Simulation.Analyzers.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Testing/Orleans.Testing.Simulation.Testing.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Testing.MTP/Orleans.Testing.Simulation.Testing.MTP.csproj --configuration Release --output artifacts/packages
          dotnet pack src/Orleans.Testing.Simulation.Tool/Orleans.Testing.Simulation.Tool.csproj --configuration Release --output artifacts/packages

  cross-platform:
    # Validates the Windows/Linux/macOS platform claim in docs/compatibility.md by
    # running the deterministic kernel's own test suite on every supported OS. This
    # is the "full" lane; the "build" job above stays the fast, single-OS lane that
    # also covers all solution projects and packing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          # Installs the newest SDK patch that global.json's latestPatch policy admits.
          global-json-file: global.json
      - name: Build
        run: dotnet build Clockwork.slnx --configuration Release
      - name: Test kernel
        run: dotnet run --project tests/Clockwork.Tests/Clockwork.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test conformance (Release lowering)
        run: dotnet run --project tests/Clockwork.Conformance.Tests/Clockwork.Conformance.Tests.csproj --configuration Release --no-build -- --timeout 300s
