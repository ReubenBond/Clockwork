name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Redirect transient process-test artifacts (staged closures, manifests, packed feeds) to a
      # known path so the failure-retention step below can surface them for debugging.
      CLOCKWORK_TEST_ARTIFACTS: ${{ runner.temp }}/clockwork-artifacts

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Clockwork.slnx --configuration Release
      - name: Test kernel
        run: dotnet run --project tests/Clockwork.Tests/Clockwork.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test Runtime scaffold
        run: dotnet run --project tests/Clockwork.Runtime.Tests/Clockwork.Runtime.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Test Instrumentation scaffold
        run: dotnet run --project tests/Clockwork.Instrumentation.Tests/Clockwork.Instrumentation.Tests.csproj --configuration Release --no-build -- --timeout 180s
      - name: Test Testing scaffold
        run: dotnet run --project tests/Clockwork.Testing.Tests/Clockwork.Testing.Tests.csproj --configuration Release --no-build -- --timeout 60s
      - name: Package smoke tests
        # Exercises the real packed NuGet artifacts end-to-end: packs Clockwork.Instrumentation.Build
        # and Clockwork.Tool into an isolated feed, consumes the build package through the real MSBuild
        # targets, and installs + runs the tool. Gated behind CLOCKWORK_SMOKE_TESTS so ordinary runs
        # skip these slower flows. CLOCKWORK_TEST_ARTIFACTS redirects transient fixtures/manifests to a
        # known path so they can be retained on failure.
        env:
          CLOCKWORK_SMOKE_TESTS: "1"
        run: dotnet run --project tests/Clockwork.Instrumentation.Tests/Clockwork.Instrumentation.Tests.csproj --configuration Release --no-build -- --timeout 600s --filter-namespace Clockwork.Instrumentation.Tests.Packaging
      - name: Upload instrumentation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clockwork-instrumentation-artifacts
          path: |
            ${{ runner.temp }}/clockwork-artifacts/**/*.manifest.json
            ${{ runner.temp }}/clockwork-artifacts/**/staged/**
            ${{ runner.temp }}/clockwork-artifacts/**/clockwork/**
          if-no-files-found: ignore
          retention-days: 7
      - name: Pack
        run: dotnet pack src/Clockwork/Clockwork.csproj --configuration Release --no-build --output artifacts/packages

  cross-platform:
    # Validates the Windows/Linux/macOS platform claim in docs/compatibility.md by
    # running the deterministic kernel's own test suite on every supported OS. This
    # is the "full" lane; the "build" job above stays the fast, single-OS lane that
    # also covers the scaffold projects and packing.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build Clockwork.slnx --configuration Release
      - name: Test kernel
        run: dotnet run --project tests/Clockwork.Tests/Clockwork.Tests.csproj --configuration Release --no-build -- --timeout 60s
